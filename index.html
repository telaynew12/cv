<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master CV Builder - Telaynew Ambachew</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --navy: #1a3c5e; --green: #27ae60; --bg: #f0f2f5; --red: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .editor-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        /* Editor Styling */
        .section-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 25px; background: #fff; border-top: 5px solid var(--navy); position: relative; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .section-header input { border: none; font-size: 18px; font-weight: bold; color: var(--navy); text-transform: uppercase; width: 50%; }
        
        .row-item { background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px dashed #ccc; margin-bottom: 10px; position: relative; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; margin-top: 8px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px; font-family: inherit; }
        
        .btn-add { background: var(--navy); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-remove { color: var(--red); cursor: pointer; border: none; background: none; font-size: 18px; font-weight: bold; position: absolute; top: 5px; right: 5px; }
        
        .btn-add-section { background: #34495e; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 20px 0; font-weight: bold; }
        .generate-btn { width: 100%; padding: 20px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; }
        
        .controls-small { display: flex; gap: 8px; align-items: center; font-size: 12px; }
        .order-input { width: 45px !important; text-align: center; }
    </style>
</head>
<body>

<div class="editor-container">
    <h1 style="text-align: center; color: var(--navy);">Infinite CV Content Manager</h1>
    
    <form id="cvForm">
        <div class="section-box">
            <div class="section-header"><h3>Main Header (Contact Info)</h3></div>
            <div class="grid-2">
                <div><label>Full Name</label><input type="text" id="userName" value="TELAYNEW AMBACHEW"></div>
                <div><label>Job Title</label><input type="text" id="userTitle" value="AI and Data Engineer"></div>
            </div>
            <label>Contacts</label>
            <div id="contact-list">
                <div class="row-item"><div class="grid-2"><input type="text" class="c-icon" value="fas fa-phone"><input type="text" class="c-val" value="+251963391736"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button></div>
                <div class="row-item"><div class="grid-2"><input type="text" class="c-icon" value="fas fa-envelope"><input type="text" class="c-val" value="telaynew11@gmail.com"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button></div>
                <div class="row-item"><div class="grid-2"><input type="text" class="c-icon" value="fab fa-linkedin"><input type="text" class="c-val" value="linkedin.com/in/telaynew-ambachew-44950825a"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button></div>
                <div class="row-item"><div class="grid-2"><input type="text" class="c-icon" value="fas fa-globe"><input type="text" class="c-val" value="https://telaynew.vercel.app"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button></div>
            </div>
            <button type="button" class="btn-add" onclick="addContactField()">+ Add Contact Field</button>
        </div>

        <div id="sections-container">
            </div>

        <button type="button" class="btn-add-section" onclick="addNewSection()">+ ADD NEW SECTION (Projects, Awards, etc.)</button>
        <button type="button" class="generate-btn" onclick="generateCV()">Download Perfect 1-Page PDF</button>
    </form>
</div>

<script>
    // Initial data from your CV
    const initialSections = [
        { title: "EXPERIENCE", col: "main", order: 1, items: [
            { title: "Software Developer", date: "Apr 2026 - Aug 2026", sub: "IE Network Solutions | Addis Ababa", bullets: "Developed CRM and Service Desk backend modules using NestJS and PostgreSQL.\nDesigned REST APIs, service layers, validation pipelines, and reusable backend architecture.\nBuilt ticket management, SLA tracking, escalation workflows, and CRM automation features.\nDesigned optimized relational database schemas for operational reporting and analytics.\nIntegrated CRM and Service Desk modules through workflow automation.\nStandardized frontend-backend API contracts, improving development efficiency across teams.\nCollaborated with cross-functional teams to deliver production-ready enterprise software." },
            { title: "AI & Data Engineer", date: "Jul 2025 - Apr 2026", sub: "Freelance", bullets: "Built enterprise AI assistants using Azure OpenAI to automate business processes and improve operational efficiency.\nDesigned and implemented Retrieval-Augmented Generation (RAG) systems with embedding pipelines, document chunking, and prompt engineering.\nDeveloped scalable backend services and REST APIs using FastAPI.\nIntegrated AI services with multiple internal and external REST APIs.\nDeployed and maintained production AI applications on Microsoft Azure.\nBuilt intelligent request-routing systems for AI, API, and hybrid workflows.\nImproved AI system performance by optimizing retrieval quality, latency, and response reliability." },
            { title: "Full Stack Developer", date: "2024 - 2025", sub: "Freelance", bullets: "Designed and developed end-to-end web applications using React, Next.js, TypeScript, Express.js, and NestJS.\nBuilt scalable backend services, REST APIs, and secure authentication systems.\nDesigned PostgreSQL databases and optimized data models for business applications.\nDeveloped AI-powered features including document processing and workflow automation.\nIntegrated third-party APIs for authentication and external business services.\nDeployed applications to Microsoft Azure using modern cloud deployment practices.\nApplied clean architecture and modular design principles to build maintainable production systems." }
        ]},
        { title: "SUMMARY", col: "side", order: 1, items: [{ title: "", date: "", sub: "", bullets: "AI Software Engineer with hands-on experience designing, building, and deploying production-grade backend systems and AI-powered applications. Experienced in FastAPI, NestJS, React, TypeScript, Python, Azure, and Large Language Models (LLMs). Specialized in Retrieval-Augmented Generation (RAG), Azure OpenAI, REST APIs, workflow automation, and cloud deployment. Passionate about building scalable software that solves real business problems through reliable engineering and practical AI solutions." }] },
        { title: "KEY PROJECTS", col: "side", order: 2, items: [
            { title: "Enterprise CRM & Service Desk", date: "", sub: "IE Network Solutions", bullets: "Developed CRM and Service Desk backend modules using NestJS and PostgreSQL.\nImplemented ticket management, SLA tracking, workflow automation, and reporting features.\nDesigned scalable REST APIs and optimized relational database schemas." },
            { title: "AI Enterprise Assistant (Copilot System)", date: "", sub: "IE Networks Solution", bullets: "Built LLM-powered assistant for automation and decision support.\nIntegrated multiple APIs with intelligent routing.\nEnabled task automation and business insights generation." },
            { title: "Food Recipe AI Platform", date: "", sub: "Freelance", bullets: "Developed a full-stack AI-powered recipe recommendation platform.\nBuilt frontend using React/Next.js and backend with Node.js.\nIntegrated AI recommendations based on available ingredients and user preferences." }
        ]},
        { title: "EDUCATION", col: "side", order: 3, items: [{ title: "BSc in Computer Science", date: "2021 - 2024", sub: "University of Gondar", bullets: "Graduated with Honors." }] },
        { title: "CERTIFICATION", col: "main", order: 3, items: [
            { title: "DP 100 - Azure Data Science", date: "", sub: "Microsoft", bullets: "" },
            { title: "Data Scientist", date: "", sub: "Datacamp", bullets: "" },
            { title: "AI 102 Design AI Solution", date: "", sub: "Microsoft", bullets: "" }
        ]},
        { title: "SKILLS", col: "side", order: 4, items: [{ title: "", date: "", sub: "", bullets: "Python, TypeScript, JavaScript, FastAPI, NestJS, React, Next.js, Azure, Azure OpenAI, RAG, LangChain, REST APIs, PostgreSQL, Docker, Git, Linux" }] }
    ];

    function addContactField(icon = "fas fa-link", val = "") {
        const div = document.createElement('div');
        div.className = 'row-item';
        div.innerHTML = `<div class="grid-2"><input type="text" class="c-icon" value="${icon}"><input type="text" class="c-val" value="${val}"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById('contact-list').appendChild(div);
    }

    function addRow(containerId, data = {title:'', date:'', sub:'', bullets:'', order:1}) {
        const div = document.createElement('div');
        div.className = 'row-item';
        div.innerHTML = `
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                <span style="font-size:10px;font-weight:bold;color:#888;">Order:</span>
                <input type="number" class="r-order" value="${data.order || 1}" style="width:50px;text-align:center;padding:4px;border:1px solid #ccc;border-radius:4px;">
                <button type="button" class="btn-remove" style="position:static;margin-left:auto;" onclick="this.closest('.row-item').remove()">×</button>
            </div>
            <div class="grid-2"><input type="text" class="r-title" value="${data.title}" placeholder="Title"><input type="text" class="r-date" value="${data.date}" placeholder="Date"></div>
            <input type="text" class="r-sub" value="${data.sub}" placeholder="Subtitle/Company">
            <textarea class="r-bullets" rows="2" placeholder="Bullets">${data.bullets}</textarea>
        `;
        document.getElementById(containerId).appendChild(div);
    }

    function addNewSection(data = {title: "New Section", col: "main", order: 5, items: []}) {
        const id = 'sec_' + Math.random().toString(36).substr(2, 9);
        const div = document.createElement('div');
        div.className = 'section-box';
        div.setAttribute('data-id', id);
        div.innerHTML = `
            <div class="section-header">
                <input type="text" class="sec-title-input" value="${data.title}">
                <div class="controls-small">
                    Order: <input type="number" class="sec-order" value="${data.order}">
                    Col: <select class="sec-col">
                        <option value="main" ${data.col==='main'?'selected':''}>Main</option>
                        <option value="side" ${data.col==='side'?'selected':''}>Side</option>
                    </select>
                    <button type="button" class="btn-remove" style="position:static" onclick="this.closest('.section-box').remove()">×</button>
                </div>
            </div>
            <div id="rows_${id}"></div>
            <button type="button" class="btn-add" onclick="addRow('rows_${id}', {order: (document.querySelectorAll('#rows_${id} .row-item').length + 1)})">+ Add Row</button>
        `;
        document.getElementById('sections-container').appendChild(div);
        if(data.items.length > 0) {
            data.items.forEach((item, idx) => {
                if(!item.order) item.order = idx + 1;
                addRow(`rows_${id}`, item)
            });
        } else {
            addRow(`rows_${id}`);
        }
    }

    // Load initial data
    initialSections.forEach(s => addNewSection(s));

    function generateCV() {
        const name = document.getElementById('userName').value;
        const job = document.getElementById('userTitle').value;
        const contacts = Array.from(document.querySelectorAll('#contact-list .row-item')).map(r => ({
            icon: r.querySelector('.c-icon').value,
            val: r.querySelector('.c-val').value
        }));

        const sectionNodes = document.querySelectorAll('.section-box[data-id]');
        const sectionData = Array.from(sectionNodes).map(node => {
            const rows = Array.from(node.querySelectorAll('.row-item'))
                .sort((a, b) => {
                    const oA = parseInt(a.querySelector('.r-order').value) || 999;
                    const oB = parseInt(b.querySelector('.r-order').value) || 999;
                    return oA - oB;
                })
                .map(row => {
                    const rt = row.querySelector('.r-title').value;
                    const rd = row.querySelector('.r-date').value;
                    const rs = row.querySelector('.r-sub').value;
                    const rb = row.querySelector('.r-bullets').value.split('\n').filter(b=>b.trim()).map(b=>`<li>${b}</li>`).join('');
                    return `<div style="margin-bottom:6px;">
                        <div style="display:flex;justify-content:space-between;color:#1a3c5e;font-size:9pt;"><strong>${rt}</strong><span>${rd}</span></div>
                        ${rs?`<div style="font-weight:bold;font-size:8pt;color:#555;margin-top:1px;">${rs}</div>`:''}
                        ${rb?`<ul style="margin:1px 0 0 15px;padding:0;font-size:8pt;line-height:1.2;">${rb}</ul>` : ''}
                    </div>`;
                }).join('');
            return { 
                title: node.querySelector('.sec-title-input').value,
                order: parseInt(node.querySelector('.sec-order').value),
                col: node.querySelector('.sec-col').value,
                html: rows
            };
        });

        const mainHtml = sectionData.filter(s=>s.col==='main').sort((a,b)=>a.order-b.order).map(s=>`<div class="stitle">${s.title}</div>${s.html}`).join('');
        const sideHtml = sectionData.filter(s=>s.col==='side').sort((a,b)=>a.order-b.order).map(s=>`<div class="stitle">${s.title}</div>${s.html}`).join('');

        const cvHtml = `
        <html><head>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>
            <style>
                /* CRITICAL FIX: Global Reset to remove all white space */
                * { margin: 0; padding: 0; box-sizing: border-box; }
                @page { size: A4; margin: 0; }
                body { margin: 0; padding: 0; width: 210mm; height: 297mm; background: white; font-family: sans-serif; overflow: hidden; }
                
                #page-container { width: 210mm; height: 297mm; position: relative; background: white; overflow: hidden; }
                
                /* FIXED HEADER: Absolute positioning to touch the left, top, and right edges exactly */
                .header { 
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 210mm; 
                    background: #1a3c5e; 
                    color: white; 
                    padding: 35px 50px 30px 50px; 
                    margin: 0;
                    z-index: 0;
                }
                
                .content { padding-top: 180px; padding-left: 50px; padding-right: 50px; padding-bottom: 20px; display: grid; grid-template-columns: 1.7fr 1fr; gap: 25px; position: relative; z-index: 1; max-height: calc(297mm - 180px); overflow: hidden; }
                .content > div { page-break-inside: avoid; break-inside: avoid; }
                .title-block h1 { font-size: 28pt; text-transform: uppercase; margin: 0; line-height: 1.1; }
                .title-block h2 { font-size: 14pt; opacity: 0.9; font-weight: 300; margin-top: 3px; }
                .contact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 8pt; margin-top: 15px; }
                .stitle { font-size: 11pt; font-weight: bold; color: #1a3c5e; text-transform: uppercase; border-bottom: 2px solid #1a3c5e; margin: 10px 0 6px 0; padding-bottom: 2px; page-break-after: avoid; break-after: avoid; }
                #dl-trigger { position: fixed; bottom: 30px; right: 30px; background: #27ae60; color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; border: none; font-weight: bold; z-index: 9999; }
            </style>
        </head>
        <body>
            <button id="dl-trigger" onclick="downloadPDF()">Download PDF Now</button>
            <div id="page-container">
                <div class="header">
                    <div class="title-block">
                        <h1>${name}</h1>
                        <h2>${job}</h2>
                    </div>
                    <div class="contact-grid">
                        ${contacts.map(c=>`<span><i class="${c.icon}"></i> ${c.val}</span>`).join('')}
                    </div>
                </div>
                <div class="content">
                    <div>${mainHtml}</div>
                    <div>${sideHtml}</div>
                </div>
            </div>
            <script>
                function downloadPDF() {
                    const el = document.getElementById('page-container');
                    const btn = document.getElementById('dl-trigger');
                    btn.style.display = 'none';
                    // Use a 0 margin array to ensure the engine doesn't inject white space
                    const opt = { 
                        margin: [0, 0, 0, 0], 
                        filename: 'Telaynew_Ambachew_CV (78).pdf', 
                        html2canvas: { scale: 4, useCORS: true }, 
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                    };
                    html2pdf().set(opt).from(el).save().then(() => btn.style.display = 'block');
                }
            <\/script>
        </body></html>`;

        const win = window.open('', '_blank');
        win.document.write(cvHtml);
        win.document.close();
    }
</script>
</body>
</html>
